<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <header class="site-header">
        <div class="logo">
            <img src="images/BB-logo-trans.png" alt="Bellis Blossom Logo with Colour">
        </div>
       
        <nav class="nav" aria-label="main navigation">
            <a href="index.html">Home</a>
            <a href="#">Collections</a>
            <a href="#">Projects</a>
            <a href="#">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="#">Log in</a>
        </nav>     
    </header>

    <main id="main">
        <section class="contact-section">
            <h1>Contact Us</h1>
                <p>Have a question? We'd love to hear from you!</p>
                <form method="post">
            <div>
                <label for="full-name">Full name</label>
                <input type="text" id="full-name" name="name" autocomplete="name" required>
            </div>

            <div>
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel">
            </div>

            <div>
            <label for="inquiries">Subject</label>
            <select name="inquiries" id="inquiries">
                <option value="general">General</option>
                <option value="or">Order</option>
                <option value="cm">Custom Order</option>
                <option value="ot">Other</option>
            </select>
            </div>

            <div>
                <label for="message">Message</label>
                <textarea name="message" id="message"></textarea>
            </div>

            <div>
                <fieldset>
                    <legend>Preferred contact method</legend>
                    <input type="radio" id="by-email" name="contact" value="email">
                    <label for="by-email">Email</label>
                    <input type="radio" id="by-phone" name="contact" value="phone">
                    <label for="by-phone">Phone</label>
                </fieldset>
            </div>
            
            <div>
                <button type="submit">Submit</button>
            </div>
                </form>

                <hr>
                <table>
                    <caption>Store hours</caption>
                    <thead>
                        <tr>
                            <th scope="col">Day</th>
                            <th scope="col">Opens</th>
                            <th scope="col">Closes</th>
                        </tr>
                    </thead>
                        <tbody>
                            <tr>
                                <th scope="row">Monday-Friday</th>
                                <td>9:00</td>
                                <td>17:00</td>
                            </tr>
                            <tr>
                                <th scope="row">Saturday</th>
                                <td>09:00</td>
                                <td>15:00</td>
                            </tr>
                            <tr>
                                <th scope="row">Sunday</th>
                                <td colspan="2">Closed</td>
                            </tr>
                        </tbody>
                        
                        <tfoot>
                            <tr>
                                <td colspan="3">Holiday hours may vary</td>
                            </tr>
                        </tfoot>
                </table>
        </section>
    </main>
</body>
</html>
